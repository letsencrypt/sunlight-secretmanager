version: "2"
linters:
  default: all
  disable:
    - depguard
    - err113
    - exhaustruct
    - exhaustruct_v5
    - goconst
    - gomodguard # deprecated; gomodguard_v2 is enabled instead
    - lll
    - musttag
    - wsl
    - wsl_v5
  settings:
    misspell:
      locale: US
    funlen:
      lines: -1
    gosec:
      excludes:
        - G104 # Errors unhandled
        - G304 # Potential file inclusion via variable
    varnamelen:
      ignore-names:
        - id
        - tc
  exclusions:
    presets:
      - std-error-handling
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
